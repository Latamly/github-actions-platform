name: SonarQube - Java Maven

on:
  workflow_call:
    inputs:
      java-version:
        description: Java version to use
        type: number
        default: 21
      sonar-project-key:
        description: SonarQube project key
        type: string
        required: true
      working-directory:
        description: Directory containing the Maven project
        type: string
        default: .
      runner-labels:
        description: JSON array of runner labels
        type: string
        default: '["self-hosted", "linux", "x64", "sonarqube"]'
    secrets:
      SONAR_TOKEN:
        required: true
      SONAR_HOST_URL:
        required: true

jobs:
  analyze:
    runs-on: ${{ fromJson(inputs.runner-labels) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}

      - name: Build and test
        working-directory: ${{ inputs.working-directory }}
        run: mvn verify

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v7.1.0
        with:
          projectBaseDir: ${{ inputs.working-directory }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
